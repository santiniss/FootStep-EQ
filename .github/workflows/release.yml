name: Build & Release StrikeEQ

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compile Native C++ APO DLL (StrikeEQ.Apo.dll)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          g++ -std=c++20 -O2 -shared -static -static-libgcc -static-libstdc++ `
            -DUNICODE -D_UNICODE `
            native/StrikeEQ.Apo/StrikeEqApo.cpp `
            native/StrikeEQ.Apo/StrikeEQ.Apo.def `
            -o publish/StrikeEQ.Apo.dll `
            -lole32 -ladvapi32 -luuid

      - name: Build & Publish Single-File StrikeEQ.exe
        shell: pwsh
        run: |
          dotnet build StrikeEQ.sln -c Release
          dotnet publish src/StrikeEQ/StrikeEQ.csproj -c Release -r win-x64 `
            --self-contained false -p:PublishSingleFile=true `
            -p:DebugType=none -p:DebugSymbols=false -o publish

      - name: Run Automated DSP & Native APO Test Suite
        shell: pwsh
        run: dotnet run --project tests/StrikeEQ.Tests/StrikeEQ.Tests.csproj -c Release --no-build

      - name: Package Portable Release ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/StrikeEQ.exe,publish/StrikeEQ.Apo.dll,README.md -DestinationPath StrikeEQ-win-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrikeEQ-win-x64
          path: StrikeEQ-win-x64.zip

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StrikeEQ-win-x64.zip
            publish/StrikeEQ.exe
            publish/StrikeEQ.Apo.dll
          generate_release_notes: true
